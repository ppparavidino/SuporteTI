<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova senha | Suporte TI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-brand">
        <img src="LOGOTIPO.png" alt="Logo Viação Pendotiba" class="brand-logo">
        <h1>Nova senha</h1>
        <p>Digite o código recebido no e-mail</p>
    </div>

    <h2>Redefinir senha</h2>

    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="nome@viacaopendotiba.com.br" autocomplete="email">

    <label for="codigo">Código (6 dígitos)</label>
    <input type="text" id="codigo" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code">

    <label for="nova_senha">Nova senha</label>
    <input type="password" id="nova_senha" placeholder="Digite a nova senha" autocomplete="new-password">

    <label for="confirma_senha">Confirmar senha</label>
    <input type="password" id="confirma_senha" placeholder="Repita a nova senha" autocomplete="new-password">

    <button type="button" class="btn-main" onclick="redefinir()">Salvar nova senha</button>

    <p id="mensagem"></p>

    <hr class="auth-divider">

    <button type="button" class="btn-ghost" onclick="window.location.href='recuperar.html'">
        Reenviar código
    </button>
    <button type="button" class="btn-ghost" onclick="window.location.href='login.html'" style="margin-top:8px;">
        Voltar ao login
    </button>
</div>

<script>
const API_URL = "http://127.0.0.1:8000";

// Preenche e-mail se veio da tela anterior
document.addEventListener("DOMContentLoaded", () => {
    const salvo = sessionStorage.getItem("recuperacao_email");
    if (salvo) {
        document.getElementById("email").value = salvo;
    }
});

async function redefinir() {
    const email = document.getElementById("email").value.trim();
    const codigo = document.getElementById("codigo").value.trim();
    const nova_senha = document.getElementById("nova_senha").value;
    const confirma = document.getElementById("confirma_senha").value;
    const mensagem = document.getElementById("mensagem");

    if (!email || !codigo || !nova_senha) {
        mensagem.style.color = "#dc2626";
        mensagem.innerText = "Preencha todos os campos.";
        return;
    }

    if (nova_senha !== confirma) {
        mensagem.style.color = "#dc2626";
        mensagem.innerText = "As senhas não coincidem.";
        return;
    }

    if (nova_senha.length < 4) {
        mensagem.style.color = "#dc2626";
        mensagem.innerText = "A senha deve ter pelo menos 4 caracteres.";
        return;
    }

    try {
        const resposta = await fetch(`${API_URL}/redefinir-senha`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email,
                codigo,
                nova_senha
            })
        });
        const dados = await resposta.json();

        if (dados.erro) {
            mensagem.style.color = "#dc2626";
            mensagem.innerText = dados.erro;
            return;
        }

        mensagem.style.color = "#16a34a";
        mensagem.innerText = dados.mensagem || "Senha alterada!";
        sessionStorage.removeItem("recuperacao_email");

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

    } catch (e) {
        console.error(e);
        mensagem.style.color = "#dc2626";
        mensagem.innerText = "Não foi possível conectar ao servidor.";
    }
}
</script>

</body>
</html>
